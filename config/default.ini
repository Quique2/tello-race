# tello_race configuration. Keys are section.key; '#' starts a comment.
# Values marked (CALIBRATE) must be measured on the practice track before the competition.

[tello]
ip = 192.168.10.1
cmd_port = 8889
state_port = 8890
local_port = 9000
video_url = udp://0.0.0.0:11111
rc_period_ms = 50            # keep-alive period for stick commands
rc_stale_s = 0.5             # watchdog: hover if the controller stops updating sticks for this long
go_y_left = true             # SDK "go x y z": +y is LEFT (verify once on the drone, CALIBRATE)
downvision = 0               # 1 = stream the belly camera (320x240 grey, Tello EDU/Talent SDK 3.0); key 'v' toggles live

[camera]
width = 960
height = 720
fx = 920                     # (CALIBRATE) intrinsics of the 960x720 stream
fy = 920
cx = 480
cy = 360
pitch_deg = 10               # (CALIBRATE) camera tilt below horizontal; refined automatically from floor tags
roll_deg = 0

[ground]
height_source = tof          # tof | fixed | tag   (height used to project pixels onto the floor)
use_imu_attitude = true      # use telemetry pitch/roll so the ground model stays valid while leaning
imu_pitch_sign = 1           # (CALIBRATE) +1 if telemetry pitch is positive nose-up
imu_roll_sign = 1
auto_calib = true            # refine camera pitch/roll from AprilTag poses seen while flying
auto_calib_min_samples = 12
auto_calib_max_dist_m = 2.2
auto_calib_min_margin = 40

[mission]
altitude_cm = 50             # cruise height (lower = sees closer to the drone, larger line in the image)
takeoff_settle_s = 1.0
max_flight_time_s = 0        # 0 = never auto-land on time (the judge stops the attempt)
min_battery = 25             # refuse takeoff below this percentage (low battery = lost turn)
post_command_blind_s = 0.5   # ignore video for this long after go/turn/move: those frames predate the command (latency)

[line]
proc_width = 640
color_mode = dark            # dark = low-value pixels of any hue (black tape) | hsv = explicit range below
dark_v_max = 90              # (CALIBRATE) with calib-color on the real track
dark_s_max = 255
hsv_lo = 0, 0, 0             # used when color_mode = hsv (H 0-180, S, V); e.g. orange tape: 8,120,90 / 22,255,255
hsv_hi = 180, 255, 255
white_check = true           # the dark line must lie on the 10 cm white strip -> rejects other lines & shadows
white_s_max = 70
white_v_min = 150
white_dilate_px = 12
min_width_cm = 1.0           # plausible projected line width (rejects AprilTag borders, large dark objects)
max_width_cm = 8.0
morph_open = 3
morph_close = 7
min_component_area = 60
bands = 12                   # scan lines at fixed ground distances ahead
band_start_m = 0.02
band_step_m = 0.15
band_max_m = 3.0
max_jump_cm = 40
horizon_margin_px = 12
tag_mask_dilate_px = 10

[tag]
family = tag36h11            # (VERIFY) family printed by the organizers
size_m = 0.16                # (CALIBRATE) black square edge length in meters
decimate = 1.5
blur = 0.0
threads = 4
refine_edges = true
sharpening = 0.25
every_n_frames = 1
min_margin = 25
max_dist_m = 3.0
position_source = pose       # pose (needs size_m) | ground (pixel -> floor projection, needs height)
confirm_frames = 2
approach_dist_m = 1.4        # stop and measure when a LEFT/RIGHT/FINISH tag is closer than this
settle_s = 0.8
settle_max_s = 2.5
gap_m = 0.8                  # rule: next segment starts 80 cm from the tag
line_end_assoc_m = 1.0
end_assoc_m = 0.6            # a tag counts only when the followed line visibly ends within this distance of it
stop_overshoot_m = 0.15
curved_approach_deg = 15     # FORWARD tags reached after a bend (heading error above this) use the precise maneuver
back_after_turn = true       # step back (search.back_cm) after a tag turn when the 80 cm start point is in the blind zone
forward_fast_path = false    # true = pass FORWARD tags without stopping (faster, but neighbouring segments can be confused)
go_speed = 60                # cm/s for the "go" over the tag
ignore_visited = true        # each tag ID appears once on the course
turn_mode = sdk              # sdk = "cw/ccw 90" | rc = closed-loop yaw on telemetry (faster, needs valid yaw)
rc_turn_rate = 50
rc_turn_tol_deg = 4
rc_turn_k = 1.5

[follow]
v_max = 60                   # forward stick on straights
v_min = 15                   # forward stick in tight curves / large heading error
lookahead_m = 0.45           # pure-pursuit distance along the line beyond its nearest visible point
k_yaw = 1.2                  # yaw stick per degree of bearing to the pursuit point
kd_yaw = 0.15
k_tangent = 0.6              # yaw stick per degree of line direction at the pursuit point (keeps the heading on the line)
k_lat = 0.8                  # lateral stick per cm of offset of the nearest line point
kd_lat = 0.2
max_yaw = 60
max_lat = 35
slow_angle_deg = 25
rotate_in_place_deg = 25     # bearing to the pursuit point above which the drone turns in place
curvature_slow = 1.0
rc_slew = 250                # max stick change per second (smooth video, no jerks)
lost_coast_s = 0.4
lost_hover_s = 1.0
k_alt = 1.0
max_ud = 30
alt_deadband_cm = 4
tag_slow_dist_m = 1.8

[acquire]
align_yaw_tol_deg = 8
align_lat_tol_cm = 12
v_forward = 20
timeout_s = 1.5
rotate_in_place_deg = 35
max_offset_m = 0.75          # after a tag turn, a line whose ends are farther than this from the expected start is ignored

[gap]
coast_rc = 25
timeout_s = 2.5              # coast at most this long without a line (about 1 m); then search instead of drifting
k_yaw_hold = 1.0
align_deg = 20               # turn in place to the line end direction before coasting if the error is larger

[search]
sweep_deg = 40
sweep_rate = 40
back_cm = 30
max_back_cm = 60             # never step back more than this in one search (the net may be behind the drone)
rise_cm = 25
max_time_s = 30

[web]
enabled = 0                  # 1 = serve the ground-station page at http://<host>:port (or --set web.enabled=1)
port = 8080
token = quiquepro            # operator token (full access: modes, sticks, start / land / emergency / camera / record). Empty = no authentication (LAN only)
viewer_token = watch         # watch-only token for spectators (share this one, never the operator token)
fps = 15                     # MJPEG rate sent to browsers (the control loop keeps running at the camera rate)
jpeg_quality = 70

[sim]
fps = 30
latency_frames = 3           # video latency (frames)
cam_pitch_true_deg = 12      # true camera tilt in the simulator (config assumes 10 -> tests auto-calibration)
cam_roll_true_deg = 0.5
rc_vel_ms = 0.02             # m/s per stick unit
rc_vz_ms = 0.01
rc_yaw_rate = 1.2            # deg/s per stick unit
tau = 0.35
yaw_tau = 0.2
lean_deg_per_ms = 8
takeoff_alt_m = 0.8
go_scale_err = 0.04
go_pos_noise_m = 0.03
turn_err_deg = 2.0
drift_sigma = 0.02
noise_sigma = 4
blur_per_ms = 2.5
px_per_m = 100
world_size_m = 9.0
line_width_cm = 3
strip_width_cm = 10
line_color_bgr = 25, 25, 25
carpet_bgr = 118, 108, 100
battery_start = 85
