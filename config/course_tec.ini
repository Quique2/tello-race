# Profile: the taped course on the white tarp (blue path, yellow decoys, tags 1-2-3-4) flown with the ORIGINAL
# mirror clip (Tello_Mirror_Clip_2.STL, 45 deg seat), which makes the front camera look straight down.
#
#   tello_race fly --profile config/course_tec.ini --set web.enabled=1
#   tello_race sim --profile config/course_tec.ini --track courses/tec_tarp
#
# Only what differs from config/default.ini is listed here. Background and numbers: docs/COURSE_TEC.md.
# Faster settings for later: add --profile config/course_tec_fast.ini after this one.

[nav]
mode = course                # follow the tape seen from above; tags are waypoints in the order given below

[camera]
pitch_deg = 96               # measured with this clip: 96-99 deg (straight down, slightly backwards). Refined in flight from the tags
flip = vertical              # the mirror turns the picture upside down: the floor AHEAD of the drone must be at the top

[mission]
altitude_cm = 120            # see docs/COURSE_TEC.md: best trade between view, accuracy and time for this clip

[line]
proc_width = 480             # half the camera width: the tape work costs half as much as at 640 and tracks the same
color_mode = blue            # blue | yellow | dark : also switchable from the ground-station page
blue_lo = 95, 80, 40         # H (0-180), S, V
blue_hi = 132, 255, 255
yellow_lo = 16, 90, 90
yellow_hi = 38, 255, 255
white_check = true           # the tape lies on the white tarp
white_dilate_cm = 6          # tape is 5 cm wide: its middle is 2.5 cm from the white
white_auto = true            # the tarp may come out darker than white_v_min on the real camera: the limit follows it down
tape_s_auto = true           # a lamp's reflection washes the tape pale (seen on the real course): the saturation limit comes down to just above the tarp's
tape_pale_v = 0.45           # ... for pixels at least this bright (share of the white within 4 cm of them). The washed tape is 0.6-0.75
                             # of the tarp, the dark cells of a tag 0.24-0.40: without this they passed for tape and a "next tape" was
                             # traced inside tag 1

[tag]
every_n_frames = 2           # the tag detector is the expensive part of the vision: every other frame is enough
decimate = 2.0
max_dist_m = 3.0
windows = true               # look for tags in small windows (tracked tags + dark squares), the whole frame once a second
full_frame_every_s = 1.0

[ground]
auto_calib_max_dist_m = 3.0
attitude_delay_s = 0.10      # the picture is older than the telemetry: take the lean from this much earlier
mount_verified = false       # camera.pitch_deg above is a guess until the tags have measured it (then kept in learned_file)
imu_signs_verified = false   # leave the lean out until the tags have shown which way the telemetry counts pitch and roll
height_from_tags = true      # scale the height sensor with the known tag size (also absorbs a focal-length error)
learned_file = learned_course_tec.ini   # mirror angle, lean signs and stick gain found in flight, kept for the next start

[path]
cell_m = 0.0125
min_width_cm = 2.0           # 5 cm tape
max_width_cm = 11.0
join_gap_m = 0.20            # the yellow tape lies across the blue one near tag 1

[course]
tag_order = 1,2,3,4
finish_id = 4
v_cruise_ms = 0.60           # on the straights
v_gap_ms = 0.25              # across the gap between a tag and the start of the next tape
v_waypoint_ms = 0.20         # at a tag when what follows is not in sight yet
lookahead_m = 0.03           # preview distance = this + lookahead_per_ms x speed
lookahead_per_ms = 0.35
k_cross = 2.0                # pull back onto the tape, m/s per m of error
k_bias = 0.3                 # ... and its integral: holds against a steady sideways drift (the real drone drifts 2 cm/s)
bias_max_ms = 0.06
accel_ms2 = 0.9              # braking allowed before corners and waypoints
lat_accel_ms2 = 0.8          # sets the speed in corners: higher = faster and rounder
# How the real drone answers the sticks, measured from the recorded flight of 2026-10-12 (tags seen in every frame
# against the sticks sent): nothing for 0.5 s (0.15 s of it is the age of the picture), then 63 % of the new speed
# after another 0.75 s. The navigator works out where the drone will be when a command starts to act, and asks for
# more than it wants so that the drone answers in shape_tau_s.
rc_gain_ms = 0.013           # m/s per stick unit: start value, measured in flight from the tags
response_tau_s = 0.75
cmd_delay_s = 0.35
latency_s = 0.15
shape_tau_s = 0.3
tag_capture_m = 0.05
start_capture_m = 0.06
next_search_m = 0.6          # the next tape starts within this distance of the tag (here: 0.12 - 0.32 m)
next_min_start_m = 0.07      # ... and not inside the tag (its half-size is 8 cm)
arrival_side_cos = 0.7       # ... and not on the side the drone came from (within 45 deg): that is the tape it came on, whole or in pieces
max_range_m = 6.0            # land if dead reckoning puts the drone further than this from where it took off (it over-reads by half: 3.5 gave false alarms)
heading = fixed              # fixed: keeps the take-off heading | path: the nose turns with the route | lead: it turns ahead of the route. Switchable on the page
k_yaw_hold = 1.0             # heading control, stick units per degree: gentle, the yaw answers late like the rest
max_yaw_rc = 40              # nose-follows-path: yaw stick limit (the drone slides wide when the nose swings fast)
# heading = lead. The real drone turns 0.65 deg/s per yaw stick unit (recorded path-mode flight of 2026-10-12): with
# the limit of 40 the nose was more than 45 deg off the direction of travel for 41 % of that flight. Lead steers the
# nose harder and earlier; fixed and path fly exactly as they did. Chosen in the simulator, see docs/COURSE_TEC.md.
lead_max_yaw_rc = 100        # yaw stick limit: 65 deg/s (70 costs little, 50 gives away half of what the mode is for)
lead_k_yaw = 1.5             # yaw stick units per degree: the stick comes off full 67 deg before the nose is there. With 2.5
                             # the nose swung 10-20 deg past in the simulator (the yaw answers late like the rest), for no better aim
lead_look_m = 0.15           # the nose takes the direction the route HAS this far beyond the preview point ...
lead_look_s = 0.7            # ... plus this many seconds of travel: it turns before the corner, and across a gap it already
                             # points along the next tape. Never beyond the end of a tape that leads to a tag not yet flown over
lead_slow_deg = 25           # fly slower while the nose is further than this from where it should point (0 = never),
lead_slow_min = 0.45         # down to this share of the speed, reached 60 deg further off
camera_ahead_m = 0.06        # the mirror looks down from 6 cm ahead of the drone centre: it is the centre that is kept on the tape
finish_altitude_cm = 85      # come down to this height on the last 60 cm before the finish tag: shorter landing

[follow]
k_alt = 1.0
alt_deadband_cm = 5

[sim]
exposure_s = 0.025           # motion blur of a 1/40 s exposure
telemetry_hz = 10            # the real Tello sends its state 10 times a second
latency_frames = 4           # picture is ~130 ms old when it is used
tau = 0.75                   # the real drone's answer to the sticks (see [course]): slow ...
rc_delay_s = 0.35            # ... and late
rc_vel_ms = 0.0135           # m/s per stick unit
inertial = true              # while the nose turns the drone keeps going the way it was moving, as a real one does
rc_yaw_rate = 0.65           # deg/s per yaw stick unit, as measured (default.ini assumes 1.2)
lean_deg_per_ms = 3          # tilt against the drag ...
lean_deg_per_ms2 = 5.8       # ... and to accelerate
start_jitter_m = 0.05
start_yaw_jitter_deg = 5
reach_radius_m = 0.15
finish_radius_m = 0.25
cam_pitch_true_deg = 97
cam_roll_true_deg = 1.5
camera_ahead_m = 0.06        # the simulated camera sits ahead of the drone centre like the real one

# What the real camera shows and a clean rendering does not, measured on the recorded flights of 2026-10-12 by putting
# recorded frames next to simulated frames of the same places (tools/camera_vs_sim.py). Off for normal runs (the
# rendering is 5 times slower with them); "python tools/sim_events.py --real-camera ..." flies with them, and so
# does any run given these lines as --set sim.key=value. A change to how tapes and tags are told apart has to pass
# here AND on the recordings (tools/replay_check.py) before it goes to the drone.
# --- real camera ---
# tag_offsets = 1,0,-0.10        # the sheets of the tags are loose: tag 1 lay 10 cm further back on its tape than in the course photo
# tag_paper_m = 0.20             # the white sheet a tag is printed on
# tag_black_bgr = 59,59,50       # the black of a tag is a dark blue-grey to the camera
# noise_sigma = 0.7              # video noise ...
# block_noise_sigma = 0.4        # ... which comes in blocks,
# tint_sigma = 1.1               # and colour errors that stay on the floor from frame to frame: patches of a tag pass for blue
# tint_wide_sigma = 0.8          # the mean colour differs from tag to tag
# tint_drift_sigma = 0.6         # and wanders during a flight
# exposure_s = 0.033             # the picture is the mean of several views over the exposure:
# exposure_samples = 8           # a turning nose smears it round the drone
# chroma_blur_px = 3             # colour is carried more coarsely than brightness: a haze of blue beyond the end of a tape
# glare_lamps = 0.64,-0.31,1.3   # a lamp (x, y, height in m): its reflection washes the glossy tape pale and moves with the drone
# glare_strength = 0.8
# mirror_edge_px = 110           # the dark band along the bottom of the picture: the mirror's lower edge
# mirror_edge_tilt_px = 40
# floor_gain = 0.38              # the floor beyond the tarp is far darker to the camera than in the photo
# --- end of real camera ---
