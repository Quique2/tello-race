# Faster settings for the taped course, laid over course_tec.ini:
#
#   tello_race fly --profile config/course_tec.ini --profile config/course_tec_fast.ini --set web.enabled=1
#
# Only after course_tec.ini has flown well on the real drone. The real drone answers the sticks slowly (see
# course_tec.ini): higher speeds mean wider corners.

[course]
lat_accel_ms2 = 1.2          # faster through the corners
accel_ms2 = 1.2              # later braking
v_cruise_ms = 0.80           # on the two long straights
v_gap_ms = 0.35              # between a tag and the next tape
