# Faster settings for the taped course, laid over course_tec.ini:
#
#   tello_race fly --profile config/course_tec.ini --profile config/course_tec_fast.ini --set web.enabled=1
#
# Simulator, 20 flights each: 23.1 s per course instead of 26.5 s, path error 2.1 cm instead of 1.8 cm.
# Only after course_tec.ini has flown well on the real drone, and only if the drone answers the sticks quickly:
# response_tau_s = 0.35 assumes it does, and a sluggish drone flown with that assumption overshoots the corners.

[course]
lat_accel_ms2 = 1.2          # faster through the corners
accel_ms2 = 1.2              # later braking
v_cruise_ms = 0.80           # on the two long straights
v_gap_ms = 0.35              # between a tag and the next tape
response_tau_s = 0.35
